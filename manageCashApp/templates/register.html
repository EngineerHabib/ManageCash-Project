{% extends 'base_auth.html' %}
{% load crispy_forms_tags %}

{% block title %}
  Account| Register
{% endblock %}

{% block content %}
  <h2>Register</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Submit" class="btn btn-primary" />
    <div>
      Already have an account? <a href="{% url 'login_user' %}">Login</a>
    </div>
  </form>
{% endblock %}
